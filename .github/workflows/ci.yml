name: ci
on:
  push:
    branches:
      - master
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - java: 17
          - java: 25
    steps:
    - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        java-version: ${{matrix.java}}
        distribution: temurin
    - uses: actions/checkout@v7
    - uses: coursier/cache-action@v9
    - uses: sbt/setup-sbt@v1
    - run: sbt
           -v
           --server
           "all scalafmtSbtCheck scalafmtCheckAll"
           testFull
      shell: bash
